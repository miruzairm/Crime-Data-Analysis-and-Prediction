<!DOCTYPE html>
<html>
<head>
    <title>Crime Analysis</title>
    <style>
      body {
        background: linear-gradient(180deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
        background-size: cover;
        height: 100vh;
        margin: 50px 0 0; /* add margin to top */
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        background-attachment: fixed; /* add this property */
      }
      h1 {
        text-align: center;
        color: #333;
      }
      form {
        max-width: 500px;
        margin: 0 auto;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.5);
      }
      label {
        display: block;
        font-size: 18px;
        color: #333;
        margin-bottom: 10px;
      }
      select, input[type="text"], input[type="number"], input[type="submit"] {
        display: block;
        width: 100%;
        padding: 10px;
        font-family: Arial, sans-serif;
        margin-bottom: 20px;
        border: none;
        border-radius: 5px;
        box-shadow: inset 0px 0px 5px 0px rgba(0,0,0,0.2);
      }
      input[type="submit"] {
        background-color: #333;
        color: #fff;
        cursor: pointer;
      }
      input[type="submit"]:hover {
        background-color: #555;
      }
      p {
        text-align: center;
        font-size: 24px;
        color: #333;
        margin-top: 30px;
      }
      img {
      display: block;
      margin: 0 auto;
      max-width: 100%;
    }
    #spatial-link{
        color: #000;
        position: absolute;
        bottom: 90%;
        left: 72%;
        transform: translateX(-50%);
        margin: 20px 0
      }
      #Home-link{
        color: #000;
        position: absolute;
        bottom: 90%;
        left: 62%;
        transform: translateX(-50%);
        margin: 20px 0
      }
      #about-link{
        color: #000;
        position: absolute;
        bottom: 90%;
        left: 90%;
        transform: translateX(-50%);
        margin: 20px 0
      }
      #total-link{
        color: #000;
        position: absolute;
        bottom: 90%;
        left: 83%;
        transform: translateX(-50%);
        margin: 20px 0
      }

    </style>
</head>
<body>
    
  <h1>Crime Analysis</h1>
  <a href="{% url 'spatial_data_analysis' %}" id="spatial-link">Spatial Data Analysis</a>
    <a href="{% url 'home' %}" id="Home-link">Crime Prediction</a>
    <a href="{% url 'about' %}" id="about-link">About</a>
    <a href="{% url 'create_line_chart' %}" id="total-link">Total Crimes Analysis</a>
  <form action="{% url 'crime_analysis' %}" method="post">
    {% csrf_token %}
    <label for="city">Select State:</label>
    <select id="city" name="city" required>
        <option value="Andhra Pradesh">Andhra Pradesh</option>
        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
        <option value="Assam">Assam</option>
        <option value="Bihar">Bihar</option>
        <option value="Chhattisgarh">Chhattisgarh</option>
        <option value="Goa">Goa</option>
        <option value="Gujarat">Gujarat</option>
        <option value="Haryana">Haryana</option>
        <option value="Himachal Pradesh">Himachal Pradesh</option>
        <option value="Jammu &amp; Kashmir">Jammu &amp; Kashmir</option>
        <option value="Jharkhand">Jharkhand</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Kerala">Kerala</option>
        <option value="Madhya Pradesh">Madhya Pradesh</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Manipur">Manipur</option>
        <option value="Meghalaya">Meghalaya</option>
        <option value="Mizoram">Mizoram</option>
        <option value="Nagaland">Nagaland
		<option value="Odisha">Odisha</option>
		<option value="Punjab">Punjab</option>
		<option value="Rajasthan">Rajasthan</option>
		<option value="Sikkim">Sikkim</option>
		<option value="Tamil Nadu">Tamil Nadu</option>
		<option value="Telangana">Telangana</option>
		<option value="Tripura">Tripura</option>
		<option value="Uttar Pradesh">Uttar Pradesh</option>
		<option value="Uttarakhand">Uttarakhand</option>
		<option value="West Bengal">West Bengal</option>
		<option value="A&amp;N Islands">A&amp;N Islands</option>
		<option value="Chandigarh">Chandigarh</option>
		<option value="D&amp;N Haveli &amp; Daman and Diu">D&amp;N Haveli &amp; Daman and Diu</option>
		<option value="Ladakh">Ladakh</option>
		<option value="Delhi UT">Delhi UT</option>
		<option value="Lakshadweep">Lakshadweep</option>
	    <option value="Puducherry">Puducherry</option>
  
    </select>
    <input type="submit" value="Submit">
  </form>
  {% if image %}
    <div style="margin-top: 50px;"> <!-- add margin to top of container -->
      <img src="data:image/png;base64,{{ image }}" alt="Crime analysis plot">
    </div>
  {% endif %}
</body>
</html>
